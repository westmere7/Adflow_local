# ============================================================================
# RMIT Adflow — nginx server block (replaces the image's default.conf)
# ----------------------------------------------------------------------------
# The app is fully static. Everything below is about serving the right MIME
# types and sensible caching; there is no proxying and no server-side logic.
#
# Cache policy, in short:
#   - HTML, version.txt, manifest/registry JSON  → never cached. The app polls
#     data/version.txt to detect a new deploy, and index.html must always
#     reference the current ?v= pins.
#   - scripts/, styles.css                        → 1 hour. Every reference is
#     version-pinned with ?v=<app version>, so a stale copy cannot be paired
#     with new page code; a short TTL just softens the reload after a deploy.
#   - lib/, data/fonts/, data/Elements/, assets   → 30 days. Vendored binaries
#     and brand assets change rarely and are large.
# ============================================================================

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Trailing-slash and directory listings off; unknown paths → 404, not index.
    autoindex off;

    # Small text files compress well; wasm and the media libs are large and do too.
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/wasm image/svg+xml
                      font/ttf font/otf;

    # Don't let browsers guess types; keep referrers inside the site.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # ---- Health endpoint for the container HEALTHCHECK / orchestrators -------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- Legacy filename alias ------------------------------------------------
    # Builds up to v0.53 referenced the brand logo as RMIT_White.svg; the file is
    # RMIT_white.svg. Case never mattered on Windows, it does here. The app also
    # normalises the id on load; this catches anything that slips through.
    location = /data/Elements/RMIT_White.svg {
        try_files /data/Elements/RMIT_white.svg =404;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- Types the stock mime.types may not cover -----------------------------
    # An empty `types {}` plus default_type pins the type regardless of the
    # base image's mime.types version.
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~* \.mjs$ {
        types { }
        default_type text/javascript;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Adflow project files: the Startup templates are served to the browser.
    location ~* \.flow$ {
        types { }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- Never cache the pages and the files that detect a new deploy --------
    location ~* \.(html|txt|json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # ---- Version-pinned app code: short TTL --------------------------------
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- Long-lived binaries and brand assets -------------------------------
    location ~* \.(woff2?|ttf|otf|png|jpe?g|gif|svg|webp|ico|mp4)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
